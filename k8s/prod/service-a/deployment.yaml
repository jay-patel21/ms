apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: node-kube-prod
  labels:
    app: service-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: service-a
        image: us-central1-docker.pkg.dev/genuine-wording-474900-e7/node-kube-repo/node-kube-app:service-a-a67182dfe41740fddb89817c04bcf8f2135e898a
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PORT
          value: '3000'
        - name: PEER_SERVICE_NAME
          value: service-a-internal
        - name: PEER_SERVICE_PORT
          value: '3000'
        - name: ENVIRONMENT
          value: production
        envFrom:
        - configMapRef:
            name: service-a-config
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
